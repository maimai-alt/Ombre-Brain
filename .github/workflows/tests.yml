name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run isolation and DecayEngine regression tests
        run: >-
          python scripts/run_isolated_tests.py -m "not external"
          tests/test_decay_switch.py
          tests/test_system_diagnostics.py
          tests/test_isolated_launcher.py
          tests/test_test_isolation.py
          -q

      - name: Run complete offline test suite
        run: python scripts/run_isolated_tests.py -m "not external" tests -q

      - name: Check Docker Compose availability
        id: compose
        shell: bash
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Docker Compose is available; static Compose tests are required."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Compose is unavailable; static Compose tests are skipped."
          fi

      - name: Run isolated Docker Compose config tests
        if: steps.compose.outputs.available == 'true'
        run: >-
          python scripts/run_isolated_tests.py -m "not external"
          tests/test_decay_compose.py -q

      - name: Report Docker Compose test skip
        if: steps.compose.outputs.available != 'true'
        run: echo "::notice::Skipping tests/test_decay_compose.py because docker compose is unavailable on this runner."
